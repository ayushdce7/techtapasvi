<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study | TechTapasvi</title>
<meta name="description" content="Detailed case study from TechTapasvi's portfolio: challenge, solution, process and results.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--n1:#010736;--n2:#0D1C42;--n3:#22396F;--cream:#FCF1D0;--soft:#fbf6e6;--line:#ece3c6;--mute:#4a5577;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:var(--n1);line-height:1.65}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.dots{display:inline-block;width:34px;height:16px;vertical-align:middle;background:radial-gradient(circle at 8px 8px,var(--cream) 8px,transparent 8.5px),radial-gradient(circle at 22px 8px,var(--n3) 8px,transparent 8.5px)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.5rem;border-radius:50px;font-weight:600;font-size:.92rem;transition:.25s}
.btn-cream{background:var(--cream);color:var(--n1)} .btn-cream:hover{background:#fff}
.btn-navy{background:var(--n3);color:var(--cream)} .btn-navy:hover{background:var(--n1)}
.btn-ghost{border:1px solid rgba(252,241,208,.5);color:var(--cream)} .btn-ghost:hover{background:var(--cream);color:var(--n1)}
h2{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.7rem}
.eb{font-size:.9rem;font-weight:500;display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}

nav{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
.brand i{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,var(--n3) 0 7px,var(--cream) 7.5px)}
.links{display:flex;gap:1.5rem;font-size:.88rem;color:var(--mute)}
.links a:hover{color:var(--n1);text-decoration:underline;text-underline-offset:5px}
@media(max-width:760px){.links{display:none}}

/* HERO */
.hero{background:var(--n1);color:var(--cream);padding:3rem 0 0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(252,241,208,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(252,241,208,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 80% 20%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 80% 20%,#000,transparent 70%)}
.hero .wrap{position:relative}
.crumb{font-size:.85rem;color:#d9d2b8;margin-bottom:1.6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumb a:hover{color:#fff;text-decoration:underline}
.tag{display:inline-block;font-size:.74rem;font-weight:600;background:var(--cream);color:var(--n1);padding:.15rem .8rem;border-radius:50px;margin-bottom:.9rem}
.hero h1{font-size:clamp(1.9rem,4vw,3.1rem);line-height:1.12;font-weight:600;color:#fff;letter-spacing:-.02em;max-width:820px}
.hero .lead{color:#d9d2b8;font-size:1.05rem;max-width:640px;margin-top:1rem}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:2rem 0 2.5rem}
.facts div{border-left:2px solid var(--cream);padding-left:.9rem}
.facts small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#aab3cc}
.facts b{font-size:.98rem;font-weight:600;color:#fff}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,1fr)}}

/* BROWSER MOCK */
.mock{background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.35);overflow:hidden;max-width:920px;margin:0 auto;position:relative}
.mock .bar{background:var(--cream);padding:.7rem 1rem;display:flex;gap:.45rem;align-items:center}
.mock .bar i{width:11px;height:11px;border-radius:50%;background:var(--n3);opacity:.5}
.mock .bar span{margin-left:.8rem;background:#fff;border-radius:50px;font-size:.72rem;padding:.1rem 1rem;color:var(--mute);flex:1;max-width:320px}
.screen{height:300px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--cream);overflow:hidden}
.screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(252,241,208,.09) 0 1px,transparent 1px 9px)}
.screen::after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:rgba(252,241,208,.1)}
.screen i{font-size:5.5rem;position:relative;z-index:1}
.g0{background:linear-gradient(135deg,#010736,#22396F)} .g1{background:linear-gradient(135deg,#0D1C42,#3a559b)}
.g2{background:linear-gradient(135deg,#22396F,#010736)} .g3{background:linear-gradient(135deg,#FCF1D0,#e8d79c);color:var(--n1)}
.g3.screen::before{background:repeating-linear-gradient(135deg,rgba(1,7,54,.07) 0 1px,transparent 1px 9px)}

/* BODY */
section{padding:3.5rem 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.panel{border-radius:24px;padding:2rem}
.panel p{color:var(--mute)}
.p-soft{background:var(--soft)} .p-navy{background:var(--n2);color:var(--cream)} .p-navy h2{color:#fff} .p-navy p{color:#d9d2b8}
.ico{width:46px;height:46px;border-radius:50%;background:var(--cream);color:var(--n1);display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1rem}

/* RESULTS */
.results{background:var(--cream);text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:1.8rem}
.kpis div{background:var(--n1);color:var(--cream);border-radius:24px;padding:2rem 1rem}
.kpis b{display:block;font-size:clamp(2rem,4.5vw,3.2rem);font-weight:600;color:#fff;line-height:1.1}
.kpis span{font-size:.9rem;color:#d9d2b8}
.note{font-size:.78rem;color:var(--mute);margin-top:1.2rem}
@media(max-width:600px){.kpis{grid-template-columns:1fr}}

/* PROCESS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-top:1.8rem;counter-reset:s}
.step{border:1px solid var(--line);border-radius:22px;padding:1.4rem;position:relative;background:#fff;transition:.3s}
.step:hover{background:var(--n3);border-color:var(--n3);transform:translateY(-4px)}
.step:hover h5,.step:hover p{color:var(--cream)}
.step::before{counter-increment:s;content:"0" counter(s);font-size:1.8rem;font-weight:600;color:var(--n3);display:block;margin-bottom:.4rem}
.step:hover::before{color:var(--cream)}
.step h5{font-size:1rem;font-weight:600}
.step p{font-size:.86rem;color:var(--mute)}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* DELIVERABLES */
.list{list-style:none;margin-top:.8rem}
.list li{display:flex;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.list li i{color:var(--n3);margin-top:.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.chips span{font-size:.82rem;border:1px solid var(--n3);color:var(--n3);padding:.25rem .95rem;border-radius:50px}

/* GALLERY */
.gal{display:grid;grid-template-columns:2fr 1fr;gap:1.2rem;margin-top:1.5rem}
.gal .mock{border-radius:18px;max-width:none}
.gal .screen{height:230px} .gal .col{display:grid;gap:1.2rem}
.gal .col .screen{height:105px} .gal .col .screen i{font-size:2.4rem}
@media(max-width:760px){.gal{grid-template-columns:1fr}}
.cap{font-size:.78rem;color:var(--mute);margin-top:.8rem}

/* NEXT + CTA */
.next{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.nx{flex:1;min-width:260px;border:1px solid var(--line);border-radius:22px;padding:1.3rem 1.5rem;transition:.3s;display:block}
.nx:hover{background:var(--soft);border-color:var(--n3);transform:translateY(-3px)}
.nx small{color:var(--mute);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.nx b{display:block;font-weight:600;margin-top:.2rem}
.nx.r{text-align:right}
.cta{background:var(--n2);color:var(--cream);text-align:center;padding:4rem 0;position:relative}
.cta::before{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:repeating-linear-gradient(135deg,rgba(252,241,208,.2) 0 1px,transparent 1px 7px)}
.cta h2{color:#fff;font-size:clamp(1.6rem,3vw,2.4rem);margin:.6rem 0 1.4rem}
.cta .btn{margin:.25rem}
footer{background:var(--n1);color:#aab3cc;text-align:center;padding:1.3rem 0;font-size:.84rem}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="../../index.html"><i></i>TechTapasvi</a>
    <div class="links"><a href="../../index.html">Home</a><a href="ayush.html">Ayush</a><a href="portfolio.html">Portfolio</a><a href="#contact">Contact</a></div>
    <a class="btn btn-navy" href="#contact">Get a Quote</a>
  </div>
</nav>

<div id="app"></div>

<section class="cta" id="contact">
  <div class="wrap">
    <div class="dots"></div>
    <h2>Want results like these?</h2>
    <a class="btn btn-cream" href="https://wa.me/919971103293" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>Chat on WhatsApp</a>
    <a class="btn btn-ghost" href="mailto:techtapasvi@gmail.com"><i class="bi bi-envelope"></i>Email us</a>
  </div>
</section>
<footer>© <span id="yr"></span> TechTapasvi · Serving clients Pan India</footer>

<script src="projects-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
let i = PROJECTS.findIndex(p => p.id === +params.get('id'));
if (i < 0) i = 0;
const p = PROJECTS[i], prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length], next = PROJECTS[(i+1)%PROJECTS.length];
const n = NICHES[p.niche];
document.title = p.title + ' — Case Study | TechTapasvi';

const steps = [
  ['Discovery','We mapped goals, audience, competitors and success metrics with the ' + p.client.toLowerCase() + ' team.'],
  ['Design & plan','Layouts and strategy were reviewed and approved before any build started.'],
  ['Build & connect','Development, tracking and automations were built, tested and connected.'],
  ['Launch & grow','Went live, then reviewed results and kept optimising what worked.']
];

document.getElementById('app').innerHTML = `
<header class="hero">
  <div class="wrap">
    <div class="crumb"><a href="portfolio.html"><i class="bi bi-arrow-left"></i> Portfolio</a> / <a href="portfolio.html#${p.niche}">${n.label}</a> / <span>Case study</span></div>
    <span class="tag">${n.label}</span>
    <h1>${p.title}</h1>
    <p class="lead">${p.lead}</p>
    <div class="facts">
      <div><small>Client</small><b>${p.client}</b></div>
      <div><small>Timeline</small><b>${p.timeline}</b></div>
      <div><small>Our role</small><b>${p.role}</b></div>
      <div><small>Year</small><b>${p.year}</b></div>
    </div>
    <div class="mock"><div class="bar"><i></i><i></i><i></i><span>yourclient.com</span></div>
      <div class="screen g${p.g}"><i class="bi ${p.icon}"></i></div></div>
  </div>
</header>

<section>
  <div class="wrap two">
    <div class="panel p-soft"><div class="ico"><i class="bi bi-exclamation-circle"></i></div><h2>The challenge</h2><p>${p.challenge}</p></div>
    <div class="panel p-navy"><div class="ico"><i class="bi bi-lightbulb"></i></div><h2>Our solution</h2><p>${p.solution}</p></div>
  </div>
</section>

<section class="results">
  <div class="wrap">
    <div class="eb" style="justify-content:center"><span class="dots"></span>Results</div>
    <h2>The impact</h2>
    <div class="kpis">${p.kpis.map(k=>`<div><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
    <p class="note">Sample figures — replace with real, verified client results.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="eb"><span class="dots"></span>How we worked</div>
    <h2>Our process</h2>
    <div class="steps">${steps.map(s=>`<div class="step"><h5>${s[0]}</h5><p>${s[1]}</p></div>`).join('')}</div>
  </div>
</section>

<section style="background:var(--soft)">
  <div class="wrap two">
    <div><h2>What we delivered</h2>
      <ul class="list">${p.deliv.map(d=>`<li><i class="bi bi-check-circle-fill"></i>${d}</li>`).join('')}</ul></div>
    <div><h2>Tools &amp; services</h2>
      <div class="chips">${p.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="eb"><span class="dots"></span>Gallery</div>
    <h2>Selected screens</h2>
    <div class="gal">
      <div class="mock"><div class="bar"><i></i><i></i><i></i><span>Homepage</span></div><div class="screen g${p.g}"><i class="bi ${p.icon}"></i></div></div>
      <div class="col">
        <div class="mock"><div class="bar"><i></i><i></i><i></i><span>Mobile</span></div><div class="screen g${(p.g+1)%4}"><i class="bi bi-phone"></i></div></div>
        <div class="mock"><div class="bar"><i></i><i></i><i></i><span>Form / checkout</span></div><div class="screen g${(p.g+2)%4}"><i class="bi bi-ui-checks"></i></div></div>
      </div>
    </div>
    <p class="cap">Placeholder visuals — swap in real screenshots.</p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap next">
    <a class="nx" href="case-study.html?id=${prev.id}"><small><i class="bi bi-arrow-left"></i> Previous project</small><b>${prev.title}</b></a>
    <a class="nx r" href="case-study.html?id=${next.id}"><small>Next project <i class="bi bi-arrow-right"></i></small><b>${next.title}</b></a>
  </div>
</section>`;
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
